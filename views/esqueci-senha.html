<div class="auth-wrap">
  <div class="auth-card">
    <h2>Esqueci minha senha</h2>
    <p class="sub">Enviamos um link para você criar uma nova senha.</p>

    <div class="alerta alerta-sucesso" ng-if="enviado">
      Se esse e-mail estiver cadastrado, o link chega em instantes.
    </div>

    <form ng-submit="enviar()" ng-if="!enviado">
      <div class="campo">
        <label>E-mail</label>
        <input type="email" ng-model="email" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Enviar link</button>
    </form>

    <div class="auth-links">
      <a href="#!/login">Voltar para o login</a>
      <span></span>
    </div>
  </div>
</div>

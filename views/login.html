<div class="container py-5" style="max-width: 400px;">
  <h2 class="mb-4 text-center">Entrar</h2>

  <div class="alert alert-danger" ng-if="erro">{{ erro }}</div>

  <form ng-submit="entrar()">
    <div class="mb-3">
      <label class="form-label">E-mail</label>
      <input type="email" class="form-control" ng-model="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Senha</label>
      <input type="password" class="form-control" ng-model="senha" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Entrar</button>
  </form>

  <div class="d-flex justify-content-between mt-3">
    <a href="#!/esqueci-senha">Esqueci minha senha</a>
    <a href="#!/cadastro">Criar conta</a>
  </div>

  <div class="mt-3">
    <a href="#!/">&larr; Voltar para o blog</a>
  </div>
</div>

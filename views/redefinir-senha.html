<div class="container py-5" style="max-width: 400px;">
  <h2 class="mb-4 text-center">Redefinir senha</h2>

  <div class="alert alert-danger" ng-if="erro">{{ erro }}</div>

  <form ng-submit="salvar()">
    <p class="text-muted">Digite sua nova senha.</p>
    <div class="mb-3">
      <label class="form-label">Nova senha</label>
      <input type="password" class="form-control" ng-model="novaSenha" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary w-100">Salvar nova senha</button>
  </form>
</div>

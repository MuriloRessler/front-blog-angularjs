<div class="auth-wrap">
  <div class="auth-card">
    <h2>Redefinir senha</h2>
    <p class="sub">Escolha uma nova senha para sua conta.</p>

    <div class="alerta alerta-erro" ng-if="erro">{{ erro }}</div>

    <form ng-submit="salvar()">
      <div class="campo">
        <label>Nova senha</label>
        <input type="password" ng-model="novaSenha" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Salvar nova senha</button>
    </form>
  </div>
</div>

<div class="container py-5" style="max-width: 600px;">
  <h2 class="mb-4">Editar postagem</h2>

  <form ng-submit="salvar()" ng-if="postagem">
    <div class="mb-3">
      <label class="form-label">Título</label>
      <input type="text" class="form-control" ng-model="postagem.title" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Descrição</label>
      <textarea class="form-control" rows="4" ng-model="postagem.description" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Imagem (URL)</label>
      <input type="text" class="form-control" ng-model="postagem.thumbImage">
    </div>
    <div class="mb-3">
      <label class="form-label">Categoria</label>
      <input type="text" class="form-control" ng-model="postagem.categoria">
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Salvar alterações</button>
      <a href="#!/post/{{ postagem.id }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>

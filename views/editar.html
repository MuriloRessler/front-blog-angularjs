<div class="form-page" ng-if="postagem">
  <h2>Editar postagem</h2>

  <form ng-submit="salvar()">
    <div class="campo">
      <label>Título</label>
      <input type="text" ng-model="postagem.title" required>
    </div>
    <div class="campo">
      <label>Descrição</label>
      <textarea ng-model="postagem.description" required></textarea>
    </div>
    <div class="campo">
      <label>Imagem (URL)</label>
      <input type="text" ng-model="postagem.thumbImage">
    </div>
    <div class="campo">
      <label>Categoria</label>
      <input type="text" ng-model="postagem.categoria">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Salvar alterações</button>
      <a href="#!/post/{{ postagem.id }}" class="btn btn-outline">Cancelar</a>
    </div>
  </form>
</div>

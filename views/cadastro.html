<div class="auth-wrap">
  <div class="auth-card">
    <h2>Criar conta</h2>
    <p class="sub">Leva menos de um minuto.</p>

    <div class="alerta alerta-erro" ng-if="erro">{{ erro }}</div>
    <div class="alerta alerta-sucesso" ng-if="sucesso">{{ sucesso }}</div>

    <form ng-submit="cadastrar()" ng-if="!sucesso">
      <div class="campo">
        <label>Nome</label>
        <input type="text" ng-model="nome" required>
      </div>
      <div class="campo">
        <label>E-mail</label>
        <input type="email" ng-model="email" required>
      </div>
      <div class="campo">
        <label>Senha</label>
        <input type="password" ng-model="senha" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
    </form>

    <div class="auth-links">
      <a href="#!/login">Já tenho conta</a>
      <span></span>
    </div>
  </div>
</div>

<div class="container py-5" style="max-width: 400px;">
  <h2 class="mb-4 text-center">Criar conta</h2>

  <div class="alert alert-danger" ng-if="erro">{{ erro }}</div>
  <div class="alert alert-success" ng-if="sucesso">{{ sucesso }}</div>

  <form ng-submit="cadastrar()" ng-if="!sucesso">
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" class="form-control" ng-model="nome" required>
    </div>
    <div class="mb-3">
      <label class="form-label">E-mail</label>
      <input type="email" class="form-control" ng-model="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Senha</label>
      <input type="password" class="form-control" ng-model="senha" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
  </form>

  <div class="mt-3">
    <a href="#!/login">Já tenho conta &rarr;</a>
  </div>
</div>
